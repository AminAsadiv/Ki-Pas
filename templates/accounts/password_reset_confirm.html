{% extends 'base.html' %}
{% block title %}New Password — KIPAS{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:var(--space-5);">
  <div style="width:100%;max-width:420px;">
    <div style="text-align:center;margin-bottom:var(--space-6);">
      <a href="/" class="navbar-logo" style="font-size:28px;display:inline-flex;margin-bottom:var(--space-3);">KIPAS</a>
      <h2>Set New Password</h2>
    </div>
    <div class="card" style="padding:var(--space-6);">
      {% if error %}
      <div style="background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.3);border-radius:var(--radius-sm);padding:var(--space-3);margin-bottom:var(--space-4);color:var(--color-danger);font-size:14px;">
        {{ error }}
      </div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" name="password" class="form-control" placeholder="Min. 8 characters" required>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" name="password2" class="form-control" placeholder="Repeat new password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Set New Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
