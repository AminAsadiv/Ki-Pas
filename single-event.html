<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - Ki Pas!</title>
    <link href="https://fonts.googleapis.com/css?family=Asap+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css"> <!-- Link to the external CSS file -->
</head>
<body>
    <header>
        <div class="logo">Ki Pas!</div>
        <nav>
            <button class="nav-button">Home</button>
            <button class="nav-button">Explore</button>
            <button class="nav-button">Events</button>
            <button class="nav-button">Friends</button>
        </nav>
        <button class="sign-in-button">Sign In</button>
        <div class="hamburger-icon" aria-expanded="false">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
    </header>
    <main>
        <div class="session-detail-container">
            <h2 class="session-title">Football Match</h2>
            <img src="https://via.placeholder.com/600" alt="Session Image" class="session-image">
            <div class="session-info">
                <p class="session-location"><strong>Location:</strong> Central Park</p>
                <p class="session-time"><strong>Time:</strong> 3 PM, October 15</p>
                <p class="session-description"><strong>Description:</strong> Join us for a friendly football match! All skill levels are welcome. Bring your friends and enjoy a fun afternoon.</p>
                <p class="session-capacity"><strong>Capacity:</strong> 10 People</p>
                <p class="session-tags"><strong>Tags:</strong> Sport, Fun</p>
                <p class="session-host"><strong>Hosted by:</strong> John Doe</p>
            </div>
            <button class="back-button" onclick="window.history.back();">Back to Sessions</button>
        </div>
    </main>
</body>
</html>
